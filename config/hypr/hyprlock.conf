# hyprlock - Rosé Pine, kept in sync with theme.css and hyprland.lua
# Doctor Who quotes live in ~/.config/hypr/dw-quotes.txt

background {
    monitor =

    path = ~/Walls/.theme-wallpaper

    blur_size = 5
    blur_passes = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[unlock] date +"%H:%M"
    font_family = GeistMono Nerd Font Propo
    font_size = 80
    color = rgba(c4a7e7ff)   # iris
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(19172488)

    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[unlock] date +"%A, %d %B"
    font_family = GeistMono Nerd Font Propo
    font_size = 18
    color = rgba(908caaee)   # subtle
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(19172488)

    position = 0, 140
    halign = center
    valign = center
}

# Doctor Who quote
label {
    monitor =
    text = cmd[unlock] $HOME/.config/hypr/dw-quote.sh
    font_family = GeistMono Nerd Font Propo
    font_size = 22
    text_align = center
    color = rgba(9ccfd8ee)   # foam
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(19172488)

    position = 0, 400
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_centered = true
    dots_size = 0.2
    dots_spacing = 0.3
    dots_rounding = -1

    outer_color = rgba(524f67dd)     # highlight-high
    inner_color = rgba(1f1d2edd)     # surface
    font_color = rgba(e0def4ee)      # text
    check_color = rgba(9ccfd8ee)     # foam
    fail_color = rgba(eb6f92ee)      # love
    fail_timeout = 1000

    placeholder_text = <i>Input password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false
    rounding = 10

    position = 0, -60
    halign = center
    valign = center
}

# Fail counter (only rendered on failure — via input-field fail_text above)
