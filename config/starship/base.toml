format = """
$username\
$hostname\
$directory\
$git_branch\
$git_metrics\
$fill\
$cmd_duration 
$character"""

# $line_break\
# $lua\
# $java\
# $c\
# $python\
# $rust\
# $git_state\
# $git_status\
# $jobs
#$time\

[nodejs]
format = "[$symbol($version )  ]($style)"

[java]
symbol = " "
format = "[$symbol($version )  ]($style)"

[lua]
symbol = " "
format = "[$symbol  ]($style)"

[c]
format = "[$symbol($version )  ]($style)"

[python]
format = "[$symbol($version )  ]($style)"

[rust]
format = "[$symbol($version )  ]($style)"

[fill]
symbol = " "

[directory]
style = "fg:rose_iris"
read_only = " "
truncation_length = 2
truncate_to_repo = true

[character]
success_symbol = "[❯](fg:rose_iris)"
error_symbol = "[❯](fg:rose_love)"
vicmd_symbol = "[❮](fg:rose_foam)"

[git_branch]
symbol = " "
format = "[$branch]($style) "
style = "fg:rose_subtle"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "fg:rose_foam"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg:rose_muted"

[git_metrics]
disabled = false

[cmd_duration]
format = "[$duration]($style)"
style = "fg:rose_gold"

[memory_usage]
symbol = " "

[battery]
full_symbol = '  '
charging_symbol = '⚡️ '

[[battery.display]]
threshold = 100
style = 'fg:rose_iris'

[[battery.display]]
threshold = 76
style = 'bold fg:rose_love'

[time]
disabled = false
style = "bold fg:rose_text"
use_12hr = true
format = "[$time]($style)"
